name: Build Quest APK

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab (works from a browser / phone)
  push:
    branches: [main]

concurrency:
  group: build-quest-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (Quest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Unity + Android toolchain images are huge; reclaim runner disk first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false          # keep the runner's Android SDK
          tool-cache: false
          large-packages: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true               # harmless if the repo doesn't use LFS

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto                 # read from ProjectSettings/ProjectVersion.txt
          androidExportType: androidPackage  # .apk (use androidAppBundle for .aab)
          androidTargetSdkVersion: AndroidApiLevel34   # adjust to what your project/Meta store expects
          allowDirtyBuild: true
          buildName: QCXR-Forge
          # --- Signing: optional. Without these, Unity signs with the debug keystore, which sideloads fine on Quest.
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Sanity check - ForgeWrapper made it into the APK
        run: |
          APK=$(find build -name '*.apk' | head -n1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "assets/hacks/(ForgeWrapper|ResConfHack)\.jar" \
            || { echo "::error::assets/hacks/ForgeWrapper.jar missing from the APK"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QCXR-Forge-Quest-APK
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14
